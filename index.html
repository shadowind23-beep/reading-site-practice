<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>아침 독서</title>
<style>
body{font-family:'Pretendard','Malgun Gothic',sans-serif;max-width:680px;margin:0 auto;padding:28px 16px 60px;line-height:1.85;word-break:keep-all;background:#fafafa;color:#222}
.top{font-size:13px;color:#0066cc;letter-spacing:.2em;margin-bottom:6px}
h1{font-size:26px;line-height:1.4;margin:0 0 6px}
.date{font-size:13px;color:#888;margin-bottom:18px}
.body p{margin:0 0 14px;font-size:16.5px}
.q{background:#fff;border:1px solid #dfe8f3;border-left:4px solid #0066cc;border-radius:10px;padding:12px 16px;margin:22px 0 12px;font-weight:600}
.src{font-size:12.5px;color:#888;margin-bottom:22px}
.src a{color:#888}
textarea{width:100%;height:90px;font-size:15px;box-sizing:border-box;border:1px solid #ccc;border-radius:8px;padding:10px}
button{margin-top:8px;padding:8px 18px;font-size:15px;background:#0066cc;color:#fff;border:0;border-radius:8px;cursor:pointer}
#msg{color:#0066cc;margin-left:8px}
h2{font-size:17px;margin:30px 0 10px}
ul{padding:0;margin:0}
li{margin:6px 0;background:#fff;border:1px solid #e5e5e5;border-radius:8px;padding:8px 12px;list-style:none;font-size:15px}
</style></head>
<body>
<div class="top">오늘의 글</div>
<h1 id="title">글을 불러오는 중</h1>
<div class="date" id="date"></div>
<div class="body" id="body"></div>
<div class="q" id="q"></div>
<div class="src" id="src"></div>
<textarea id="t" placeholder="읽고 떠오른 생각을 적어 보세요"></textarea>
<div><button id="b">저장</button><span id="msg"></span></div>
<h2>우리 반이 남긴 생각</h2><ul id="list"></ul>
<script type="module">
import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';
const sb = createClient('https://epuftjigrootgidpxahu.supabase.co','sb_publishable_c_Pi2io6KP-qn1ISn1ncmg_h0H-oVro');
const esc = s => (s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;');
async function article(){
  const { data } = await sb.from('articles').select('*').order('created_at',{ascending:false}).limit(1);
  const a = data && data[0]; if(!a){ document.getElementById('title').textContent='아직 올라온 글이 없습니다'; return; }
  document.getElementById('title').textContent = a.title;
  document.getElementById('date').textContent = new Date(a.created_at).toLocaleDateString('ko-KR',{year:'numeric',month:'long',day:'numeric',weekday:'long'});
  document.getElementById('body').innerHTML = a.body.split(/\n\s*\n/).map(p=>'<p>'+esc(p)+'</p>').join('');
  document.getElementById('q').textContent = a.question || '';
  document.getElementById('src').innerHTML = (a.sources||'').split('\n').map(l=>{const [n,u]=l.split('|').map(x=>x.trim()); return u?'출처: <a href="'+u+'" target="_blank">'+esc(n)+'</a>':esc(l);}).join('<br>');
}
async function load(){ const { data } = await sb.from('reflections').select('content,created_at').order('created_at',{ascending:false}).limit(20);
  document.getElementById('list').innerHTML=(data||[]).map(r=>'<li>'+esc(r.content)+'</li>').join(''); }
document.getElementById('b').onclick=async()=>{ const v=document.getElementById('t').value.trim(); if(!v) return;
  const { error } = await sb.from('reflections').insert({ content:v });
  document.getElementById('msg').textContent = error ? '저장이 안 됐어요' : '저장했어요';
  if(!error){ document.getElementById('t').value=''; load(); } };
article(); load();
</script></body></html>
