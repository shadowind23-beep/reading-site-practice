<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>아침 독서</title>
<style>body{font-family:sans-serif;max-width:640px;margin:40px auto;padding:0 16px;line-height:1.8;word-break:keep-all;background:#fafafa;color:#222}h1{font-size:24px}textarea{width:100%;height:90px;font-size:15px;box-sizing:border-box}button{margin-top:8px;padding:8px 18px;font-size:15px;background:#0066cc;color:#fff;border:0;border-radius:8px;cursor:pointer}#msg{color:#0066cc;margin-left:8px}ul{padding-left:18px}li{margin:6px 0;background:#fff;border:1px solid #e5e5e5;border-radius:8px;padding:8px 12px;list-style:none}</style></head>
<body><h1>오늘의 글 (고쳐서 다시 올림)</h1><p>연습용 페이지입니다. 깃허브에 올리고 네트리파이로 주소를 만드는 과정을 확인합니다.</p>
<p>내 생각 한 줄</p><textarea id="t" placeholder="읽고 떠오른 생각을 적어 보세요"></textarea>
<div><button id="b">저장</button><span id="msg"></span></div>
<h2 style="font-size:18px;margin-top:28px">우리 반이 남긴 생각</h2><ul id="list"></ul>
<script type="module">
import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';
const sb = createClient('https://epuftjigrootgidpxahu.supabase.co','sb_publishable_c_Pi2io6KP-qn1ISn1ncmg_h0H-oVro');
async function load(){ const { data } = await sb.from('reflections').select('content,created_at').order('created_at',{ascending:false}).limit(20);
  document.getElementById('list').innerHTML=(data||[]).map(r=>'<li>'+r.content.replace(/</g,'&lt;')+'</li>').join(''); }
document.getElementById('b').onclick=async()=>{ const v=document.getElementById('t').value.trim(); if(!v) return;
  const { error } = await sb.from('reflections').insert({ content:v });
  document.getElementById('msg').textContent = error ? '저장이 안 됐어요' : '저장했어요';
  if(!error){ document.getElementById('t').value=''; load(); } };
load();
</script></body></html>
